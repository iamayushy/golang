services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BASE_URL: http://localhost:8080
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: urlshortener
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongo

  web:
    build: ./web
    ports:
      - "3000:8080"
    environment:
      API_URL: http://localhost:8080
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
